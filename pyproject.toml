[project]
name = "flet-hello"
version = "0.1.0"
description = "A Flet Hello World app template"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "flet>=0.85.3"
]

[dependency-groups]
dev = [
    "flet-cli>=0.85.3",
    "flet-desktop>=0.85.3",
    "flet-web>=0.85.3",
]

[tool.flet]
org = "com.example"
product = "flet-hello"

[tool.flet.app]
path = "src"
