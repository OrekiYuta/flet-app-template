name: Build Flet App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14"

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install flet==0.85.3
      - run: flet build web --yes
      - run: cd build/web && zip -r ../../flet-hello-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web-app
          path: flet-hello-web.zip

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install flet==0.85.3
      - run: flet build apk --yes
      - run: cp build/apk/*.apk ./flet-hello-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: flet-hello-android.apk

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - run: pip install flet==0.85.3
      - run: flet build linux --yes
      - run: cd build/linux && tar -czf ../../flet-hello-linux.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: flet-hello-linux.tar.gz

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install flet==0.85.3
      - run: flet build macos --yes --arch arm64
      - run: cd build/macos && zip -r ../../flet-hello-macos.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: flet-hello-macos.zip

  build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      FLET_CLI_NO_RICH_OUTPUT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install flet==0.85.3
      - run: flet build windows --yes --no-rich-output
      - run: Compress-Archive -Path build/windows/* -DestinationPath flet-hello-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-app
          path: flet-hello-windows.zip

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install flet==0.85.3
      - run: flet build ipa --yes --ios-export-method debugging
      - run: cd build/ipa && zip -r ../../flet-hello-ios.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: flet-hello-ios.zip

  release:
    needs: [build-web, build-apk, build-linux, build-macos, build-windows, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
